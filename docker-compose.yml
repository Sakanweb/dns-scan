name: dns-scan

# Stack:
#   migrate -> one-shot schema
#   nginx   -> UI on HTTP_PORT from .env
#   php     -> PHP-FPM
#   worker  -> one pipeline stage per tick
#   mariadb -> data on MYSQL_PORT from .env

services:
  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dns-scan-migrate
    working_dir: /app
    command: ["php", "yii", "migrate"]
    volumes:
      - ./app:/app
    env_file: .env
    environment:
      DB_DSN: ${YII_DB_DSN}
      DB_USER: ${YII_DB_USER}
      DB_PASSWORD: ${YII_DB_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dns-scan-php
    working_dir: /app
    volumes:
      - ./app:/app
    env_file: .env
    environment:
      DB_DSN: ${YII_DB_DSN}
      DB_USER: ${YII_DB_USER}
      DB_PASSWORD: ${YII_DB_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: dns-scan-nginx
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
    volumes:
      - ./app:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dns-scan-worker
    working_dir: /app
    command: ["php", "yii", "scan:worker", "--loop", "--sleep=2"]
    volumes:
      - ./app:/app
    env_file: .env
    environment:
      DB_DSN: ${YII_DB_DSN}
      DB_USER: ${YII_DB_USER}
      DB_PASSWORD: ${YII_DB_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: dns-scan-mariadb
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - dns_scan_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  dns_scan_mariadb:
    name: dns_scan_mariadb
